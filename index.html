<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Mis Cuentas</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#14201d; --muted:#5f6f6a; --line:#e2e8e5;
  --accent:#0f766e; --accent-soft:#d9f0ec; --danger:#c2410c; --danger-soft:#fdeadf;
  --ok:#15803d; --ok-soft:#dcf3e2; --warn:#b45309; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1413; --card:#172120; --text:#e8efed; --muted:#93a39e; --line:#26332f;
    --accent:#2dd4bf; --accent-soft:#123a35; --danger:#fb923c; --danger-soft:#3a2216;
    --ok:#4ade80; --ok-soft:#14321f; --warn:#fbbf24; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){button{color:#06201c}}
button.ghost{background:transparent;color:var(--accent);padding:8px 10px}
button.soft{background:var(--accent-soft);color:var(--accent)}
button.danger{background:var(--danger-soft);color:var(--danger)}
button.small{padding:6px 10px;font-size:14px;border-radius:9px}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:550}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
.muted{color:var(--muted)}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.num{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.neg{color:var(--danger)} .pos{color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--danger)}
.stats{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.monthnav{display:flex;align-items:center;gap:4px;margin-bottom:14px;justify-content:center}
.monthnav h2{min-width:170px;text-align:center;font-size:19px}
.monthnav button{width:42px;height:42px;padding:0;font-size:20px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:18px 0 6px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:10px;font-weight:600}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lock .card{width:100%;max-width:400px;padding:26px}
.lock h1{font-size:26px;margin-bottom:6px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:4px 0 8px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal .card{width:100%;max-width:480px;margin:0}
@media (min-width:600px){.modal{align-items:center}}
.menu button{width:100%;text-align:left;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.paid .t,.paid .num{text-decoration:line-through;opacity:.6}
.modal .card{max-height:calc(100vh - 32px);overflow:auto}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:14px}
.stats3>div:nth-child(2){text-align:center}.stats3>div:nth-child(3){text-align:right}
.obj{padding:12px 0;border-top:1px solid var(--line)}
.obj:first-child{border-top:0;padding-top:4px}
.obj .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.obj .h .n{font-weight:600;overflow-wrap:anywhere}
.obj .bar{margin:8px 0 5px}
.obj .s{font-size:13px;color:var(--muted)}
.obj .s.bad{color:var(--danger);font-weight:600}
.obj .s.good{color:var(--ok);font-weight:600}
.obj .s.warn{color:var(--warn);font-weight:600}
.bar.warn>i{background:var(--warn)}
.bar.goal>i{background:var(--ok)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.hint.bad{color:var(--danger)}
.oe{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.oe .row{margin-top:8px}
.oe select{flex:1}
.alerta-ico{font-size:40px;line-height:1;margin-bottom:8px}
</style>
</head>
<body>

<!-- Pantalla de bloqueo -->
<div id="lockView" class="lock">
  <div class="card">
    <h1>Mis Cuentas</h1>
    <p class="muted" id="lockMsg" style="margin:0 0 18px"></p>
    <form id="lockForm" autocomplete="off">
      <div class="field"><label for="pw1">Contraseña</label><input id="pw1" type="password" autocomplete="current-password" required></div>
      <div class="field hidden" id="pw2wrap"><label for="pw2">Repite la contraseña</label><input id="pw2" type="password" autocomplete="new-password"></div>
      <div class="err" id="lockErr"></div>
      <button type="submit" style="width:100%" id="lockBtn">Entrar</button>
    </form>
    <button class="ghost" id="restoreBtn" style="width:100%;margin-top:10px">Restaurar desde una copia</button>
  </div>
</div>

<!-- App -->
<div id="appView" class="hidden">
  <div class="wrap">
    <div class="top">
      <h1 style="font-size:22px">Mis Cuentas</h1>
      <div class="row">
        <button class="ghost" id="menuBtn" aria-label="Menú">Opciones</button>
        <button class="soft small" id="lockNow">Bloquear</button>
      </div>
    </div>

    <!-- Pestaña Mes -->
    <section id="tabMes">
      <div class="monthnav">
        <button class="soft" id="prevM" aria-label="Mes anterior">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="soft" id="nextM" aria-label="Mes siguiente">›</button>
      </div>

      <div class="card">
        <div class="muted" style="font-size:14px">Saldo disponible</div>
        <div class="big" id="saldo"></div>
        <div class="bar" id="bar"><i id="barFill"></i></div>
        <div class="stats3">
          <div><div class="muted">Nómina</div><div class="num" id="nominaTxt"></div></div>
          <div><div class="muted">Gastado</div><div class="num" id="gastadoTxt"></div></div>
          <div><div class="muted">Ahorrado</div><div class="num" id="ahorradoTxt"></div></div>
        </div>
        <form id="nominaForm" class="row" style="margin-top:14px">
          <input id="nominaIn" inputmode="decimal" placeholder="Nómina del mes (€)">
          <button type="submit">Guardar</button>
        </form>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h3>Objetivos del mes</h3>
          <button class="soft small" id="editObj">Editar</button>
        </div>
        <div id="objList"></div>
        <div class="hint" id="objResumen"></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">Añadir gasto o ahorro</h3>
        <form id="gastoForm" autocomplete="off">
          <div class="field"><label for="gConcepto">Concepto</label><input id="gConcepto" required placeholder="Ej. Supermercado"></div>
          <div class="grid2">
            <div class="field"><label for="gImporte">Importe (€)</label><input id="gImporte" inputmode="decimal" required placeholder="0,00"></div>
            <div class="field"><label for="gFecha">Fecha</label><input id="gFecha" type="date" required></div>
          </div>
          <div class="field"><label for="gCat">Objetivo</label>
            <select id="gCat"></select>
            <div class="hint" id="gCatHint"></div>
          </div>
          <button type="submit" style="width:100%">Añadir</button>
        </form>
      </div>

      <div class="card">
        <h3>Gastos del mes</h3>
        <ul class="list" id="gastosList" style="margin-top:6px"></ul>
      </div>
    </section>

    <!-- Pestaña Me deben -->
    <section id="tabDeben" class="hidden">
      <div class="card">
        <div class="muted" style="font-size:14px">Total que te deben</div>
        <div class="big pos" id="totalDeben"></div>
        <div class="muted" style="font-size:14px;margin-top:4px" id="numDeben"></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">Añadir deuda</h3>
        <form id="deudaForm" autocomplete="off">
          <div class="grid2">
            <div class="field"><label for="dNombre">Nombre</label><input id="dNombre" required placeholder="¿Quién?"></div>
            <div class="field"><label for="dImporte">Cantidad (€)</label><input id="dImporte" inputmode="decimal" required placeholder="0,00"></div>
          </div>
          <div class="field"><label for="dDesc">Descripción</label><textarea id="dDesc" rows="2" placeholder="Ej. Cena del sábado"></textarea></div>
          <button type="submit" style="width:100%">Añadir</button>
        </form>
      </div>

      <div class="card">
        <h3>Pendientes</h3>
        <ul class="list" id="debenList" style="margin-top:6px"></ul>
        <details id="cobradasWrap" style="margin-top:10px">
          <summary id="cobradasSum">Cobradas</summary>
          <ul class="list" id="cobradasList"></ul>
        </details>
      </div>
    </section>
  </div>

  <nav class="tabs">
    <button id="tMes" class="on">Cuentas del mes</button>
    <button id="tDeben">Me deben</button>
  </nav>
</div>

<!-- Modales -->
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<div id="toast" class="toast hidden"></div>

<script>
(() => {
'use strict';
const STORE = 'miscuentas.v1';
const ITER = 250000;
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);

let key = null, salt = null, state = null;
let cur = monthKey(new Date());
let pendingImport = null;
let hiddenAt = 0;
let mesHoy = cur;
function irAlMesActual(){
  const ahora = monthKey(new Date());
  if (ahora !== mesHoy) { mesHoy = ahora; cur = ahora; if (state) render(); }
}
setInterval(irAlMesActual, 60*1000);

/* ---------- utilidades ---------- */
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const money = n => eur.format(Math.round(n*100)/100);
function parseMoney(s){
  s = String(s||'').trim().replace(/\s|€/g,'');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',', '.');
  else s = s.replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n*100)/100 : NaN;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add('hidden'),2600); }

function b64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

/* ---------- cifrado ---------- */
async function deriveKey(pass, s){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:s, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptState(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(state)));
  return {app:'miscuentas', v:1, salt:b64(salt), iv:b64(iv), data:b64(ct)};
}
async function decryptBlob(blob, pass){
  const s = unb64(blob.salt);
  const k = await deriveKey(pass, s);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, k, unb64(blob.data));
  return {st: JSON.parse(dec.decode(pt)), k, s};
}
function readStored(){ try { const r = localStorage.getItem(STORE); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
async function save(){
  try { localStorage.setItem(STORE, JSON.stringify(await encryptState())); }
  catch(e){ toast('No se pudo guardar en este navegador. Haz una copia desde Opciones.'); }
}
function normalize(st){
  st = st && typeof st==='object' ? st : {};
  st.months = st.months || {};
  st.deudas = Array.isArray(st.deudas) ? st.deudas : [];
  if (!Array.isArray(st.objetivos)) {
    // Primera vez con objetivos: se crean unos de ejemplo (sin límite) y los gastos antiguos se asignan por su categoría
    const base = [['Ahorro','ahorro'],['Vivienda','gasto'],['Comida','gasto'],['Facturas','gasto'],['Transporte','gasto'],['Ocio','gasto'],['Salud','gasto'],['Compras','gasto']];
    st.objetivos = base.map(([nombre,tipo]) => ({id:uid(), nombre, tipo, limite:0}));
    const porNombre = {};
    st.objetivos.forEach(o => porNombre[o.nombre.toLowerCase()] = o.id);
    porNombre['casa'] = porNombre['vivienda'];
    Object.values(st.months).forEach(m => (m.gastos||[]).forEach(g => {
      if (!g.obj) { const id = porNombre[String(g.cat||'').toLowerCase()]; if (id) g.obj = id; }
    }));
  }
  Object.values(st.months).forEach(m => { m.gastos = m.gastos || []; m.nomina = m.nomina || 0; });
  return st;
}

/* ---------- objetivos ---------- */
const objById = id => state.objetivos.find(o => o.id === id);
const objsActivos = () => state.objetivos.filter(o => !o.archivado);
function limiteDe(m, o){ return m.lim && m.lim[o.id] != null ? m.lim[o.id] : (o.limite || 0); }
function totalObj(m, id){ return m.gastos.filter(g => g.obj === id).reduce((s,g) => s + g.importe, 0); }
function objsDelMes(m){
  return state.objetivos.filter(o => {
    const usado = m.gastos.some(g => g.obj === o.id);
    return m.lim ? (o.id in m.lim || usado) : (!o.archivado || usado);
  });
}
function nombreGasto(g){ const o = g.obj && objById(g.obj); return o ? o.nombre : (g.cat && g.cat !== 'Otros' && !g.obj ? g.cat : 'Otros'); }
function esAhorro(g){ const o = g.obj && objById(g.obj); return !!(o && o.tipo === 'ahorro'); }
// Antes de cambiar objetivos, los meses pasados guardan sus límites para que su historial no cambie
function congelarPasados(){
  const ahora = monthKey(new Date());
  for (const [k, m] of Object.entries(state.months)) {
    if (k < ahora && !m.lim) { m.lim = {}; state.objetivos.forEach(o => { if (!o.archivado) m.lim[o.id] = o.limite || 0; }); }
  }
}

function alerta(icono, titulo, texto){
  try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch(_){}
  openModal(`<div class="alerta-ico">${icono}</div><h3 style="margin-bottom:8px">${esc(titulo)}</h3>
    <p class="muted" style="margin:0 0 16px">${esc(texto)}</p>
    <button style="width:100%" id="alOk">Entendido</button>`);
  $('alOk').onclick = closeModal;
}
function avisar(o, lim, antes, despues){
  if (!o || !(lim > 0) || despues === antes) return false;
  if (o.tipo === 'ahorro') {
    if (antes < lim && despues >= lim) { alerta('🎉', '¡Objetivo conseguido!', `Has llegado a ${money(lim)} en ${o.nombre} este mes.`); return true; }
    return false;
  }
  if (despues > lim && antes <= lim) alerta('⚠️', `Has superado el límite de ${o.nombre}`, `Llevas ${money(despues)} y tu límite es ${money(lim)}. Te has pasado ${money(despues - lim)}.`);
  else if (despues === lim && antes < lim) alerta('⚠️', `Has llegado al límite de ${o.nombre}`, `Ya has gastado los ${money(lim)} que tenías para este mes.`);
  else if (despues > lim) toast(`Sigues por encima del límite de ${o.nombre} (+${money(despues - lim)})`);
  else if (despues >= lim * 0.8 && antes < lim * 0.8) toast(`Atención: llevas el ${Math.floor(despues / lim * 100)} % de ${o.nombre}. Quedan ${money(lim - despues)}`);
  else return false;
  return true;
}

function editarObjetivos(){
  let lista = objsActivos().map(o => ({...o}));
  const pintar = () => {
    $('oeList').innerHTML = lista.length ? lista.map((o,i) => `
      <div class="oe">
        <div class="grid2">
          <input data-i="${i}" data-f="nombre" placeholder="Nombre (ej. Ocio)" value="${esc(o.nombre)}">
          <input data-i="${i}" data-f="limite" inputmode="decimal" placeholder="Cantidad €" value="${o.limite ? String(o.limite).replace('.', ',') : ''}">
        </div>
        <div class="row">
          <select data-i="${i}" data-f="tipo">
            <option value="gasto"${o.tipo !== 'ahorro' ? ' selected' : ''}>Límite de gasto</option>
            <option value="ahorro"${o.tipo === 'ahorro' ? ' selected' : ''}>Meta de ahorro</option>
          </select>
          <button type="button" class="danger small" data-del="${i}">Quitar</button>
        </div>
      </div>`).join('') : '<p class="empty">No tienes objetivos. Añade uno.</p>';
    $('oeList').querySelectorAll('[data-f]').forEach(el => el.oninput = el.onchange = () => { lista[el.dataset.i][el.dataset.f] = el.value; });
    $('oeList').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { lista.splice(+b.dataset.del, 1); pintar(); });
    actualizarTotal();
  };
  const actualizarTotal = () => {
    const tot = lista.reduce((s,o) => { const n = parseMoney(o.limite); return s + (isNaN(n) ? 0 : n); }, 0);
    const nom = (state.months[monthKey(new Date())] || {}).nomina || 0;
    $('oeTotal').textContent = `Total repartido: ${money(tot)}` + (nom ? ` de ${money(nom)} de nómina` : '');
    $('oeTotal').classList.toggle('bad', nom > 0 && tot > nom);
  };
  openModal(`<h3 style="margin-bottom:6px">Tus objetivos</h3>
    <p class="muted" style="font-size:14px;margin:0 0 14px">Se aplican a todos los meses y se ponen a cero cada día 1. Deja la cantidad vacía si solo quieres usarlo para clasificar.</p>
    <div id="oeList"></div>
    <button type="button" class="soft" id="oeAdd" style="width:100%;margin-bottom:6px">+ Añadir objetivo</button>
    <div class="hint" id="oeTotal" style="margin-bottom:12px"></div>
    <div class="err" id="oeErr"></div>
    <div class="row"><button type="button" class="ghost" id="oeX">Cancelar</button><button type="button" style="flex:1" id="oeOk">Guardar</button></div>`);
  $('oeList').addEventListener('input', actualizarTotal);
  $('oeAdd').onclick = () => { lista.push({id:uid(), nombre:'', tipo:'gasto', limite:''}); pintar(); const ins = $('oeList').querySelectorAll('[data-f="nombre"]'); ins[ins.length-1].focus(); };
  $('oeX').onclick = closeModal;
  $('oeOk').onclick = async () => {
    const limpia = [];
    for (const o of lista) {
      const nombre = String(o.nombre || '').trim();
      const lim = String(o.limite ?? '').trim() === '' ? 0 : parseMoney(o.limite);
      if (!nombre && !lim) continue;
      if (!nombre) { $('oeErr').textContent = 'Ponle nombre a todos los objetivos.'; return; }
      if (isNaN(lim) || lim < 0) { $('oeErr').textContent = `La cantidad de «${nombre}» no es válida.`; return; }
      limpia.push({id:o.id, nombre, tipo:o.tipo === 'ahorro' ? 'ahorro' : 'gasto', limite:lim});
    }
    congelarPasados();
    const nuevos = new Set(limpia.map(o => o.id));
    const quitados = state.objetivos.filter(o => !nuevos.has(o.id))
      .filter(o => Object.values(state.months).some(m => m.gastos.some(g => g.obj === o.id)))
      .map(o => ({...o, archivado:true}));
    state.objetivos = [...limpia, ...quitados];
    closeModal(); await save(); render(); toast('Objetivos guardados');
  };
  pintar();
}
$('editObj').addEventListener('click', editarObjetivos);

function opcionesObjetivos(sel, extra){
  const lista = objsActivos();
  if (extra && !lista.includes(extra)) lista.push(extra);
  return lista.map(o => `<option value="${o.id}"${o.id === sel ? ' selected' : ''}>${esc(o.nombre)}${o.tipo === 'ahorro' ? ' (ahorro)' : ''}</option>`).join('')
    + `<option value=""${!sel ? ' selected' : ''}>Otros (sin objetivo)</option>`;
}
function pintarHint(){
  const o = objById($('gCat').value), h = $('gCatHint');
  h.classList.remove('bad');
  if (!o) { h.textContent = ''; return; }
  const fecha = $('gFecha').value || defaultDate();
  const m = state.months[fecha.slice(0,7)] || {gastos:[], nomina:0};
  const lim = limiteDe(m, o), llevas = totalObj(m, o.id);
  if (!(lim > 0)) { h.textContent = `${o.nombre}: llevas ${money(llevas)} este mes (sin límite).`; return; }
  if (o.tipo === 'ahorro') { h.textContent = `${o.nombre}: llevas ${money(llevas)} de ${money(lim)}.`; return; }
  if (llevas > lim) { h.textContent = `${o.nombre}: te has pasado ${money(llevas - lim)} del límite.`; h.classList.add('bad'); }
  else h.textContent = `${o.nombre}: llevas ${money(llevas)} de ${money(lim)} · quedan ${money(lim - llevas)}`;
}
$('gCat').addEventListener('change', pintarHint);
$('gFecha').addEventListener('change', pintarHint);

/* ---------- bloqueo ---------- */
function showLock(){
  key = null; state = null;
  $('appView').classList.add('hidden'); $('lockView').classList.remove('hidden');
  closeModal();
  const stored = readStored();
  const creating = !stored && !pendingImport;
  $('pw2wrap').classList.toggle('hidden', !creating);
  $('pw2').required = creating;
  $('pw1').autocomplete = creating ? 'new-password' : 'current-password';
  $('lockMsg').textContent = pendingImport ? 'Introduce la contraseña con la que se hizo la copia.'
    : creating ? 'Crea una contraseña. Tus datos se guardan cifrados solo en este dispositivo. Si la olvidas no se pueden recuperar.'
    : 'Introduce tu contraseña para abrir tus cuentas.';
  $('lockBtn').textContent = creating ? 'Crear y entrar' : 'Entrar';
  $('restoreBtn').classList.toggle('hidden', !!pendingImport);
  $('pw1').value=''; $('pw2').value=''; $('lockErr').textContent='';
  setTimeout(()=>$('pw1').focus(), 50);
}
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const p1 = $('pw1').value, p2 = $('pw2').value;
  const err = $('lockErr'); err.textContent='';
  if (!window.crypto || !crypto.subtle){ err.textContent='Este navegador no permite el cifrado. Ábrelo desde una dirección https.'; return; }
  $('lockBtn').disabled = true;
  try {
    const blob = pendingImport || readStored();
    if (!blob){
      if (p1.length < 4){ err.textContent='Usa al menos 4 caracteres.'; return; }
      if (p1 !== p2){ err.textContent='Las contraseñas no coinciden.'; return; }
      salt = crypto.getRandomValues(new Uint8Array(16));
      key = await deriveKey(p1, salt);
      state = normalize({});
      await save();
    } else {
      try { const r = await decryptBlob(blob, p1); state = normalize(r.st); key = r.k; salt = r.s; }
      catch(_){ err.textContent='Contraseña incorrecta.'; return; }
      if (pendingImport){ pendingImport = null; await save(); toast('Copia restaurada'); }
    }
    $('lockView').classList.add('hidden'); $('appView').classList.remove('hidden');
    irAlMesActual();
    render();
  } finally { $('lockBtn').disabled = false; }
});
$('restoreBtn').addEventListener('click', ()=>$('fileIn').click());
$('lockNow').addEventListener('click', showLock);
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) hiddenAt = Date.now();
  else if (key && hiddenAt && Date.now()-hiddenAt > 3*60*1000) showLock(); // se bloquea tras 3 min en segundo plano
  else irAlMesActual();
});

/* ---------- copias ---------- */
$('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value='';
  if (!f) return;
  try {
    const blob = JSON.parse(await f.text());
    if (blob.app!=='miscuentas' || !blob.data) throw 0;
    if (key && !confirm('Esto sustituirá los datos de este dispositivo por los de la copia. ¿Continuar?')) return;
    pendingImport = blob; showLock();
  } catch(_){ toast('Ese archivo no es una copia válida de Mis Cuentas'); }
});
async function exportBackup(){
  const blob = await encryptState();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(blob)], {type:'application/json'}));
  a.download = 'mis-cuentas-copia-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Copia descargada (va cifrada con tu contraseña)');
}

/* ---------- modales ---------- */
function openModal(html){ $('modalCard').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalCard').innerHTML=''; }
$('modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });

$('menuBtn').addEventListener('click', () => {
  openModal(`<h3 style="margin-bottom:14px">Opciones</h3>
    <div class="menu">
      <button class="soft" data-a="exp">Descargar copia de seguridad</button>
      <button class="soft" data-a="imp">Restaurar desde una copia</button>
      <button class="soft" data-a="pw">Cambiar contraseña</button>
      <button class="danger" data-a="wipe">Borrar todos los datos de este dispositivo</button>
      <button class="ghost" data-a="x" style="text-align:center">Cerrar</button>
    </div>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Los datos solo están en este navegador. Para pasarlos al móvil u otro dispositivo, descarga una copia aquí y restáurala allí.</p>`);
  $('modalCard').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a==='exp'){ closeModal(); exportBackup(); }
    else if (a==='imp'){ closeModal(); $('fileIn').click(); }
    else if (a==='pw') changePw();
    else if (a==='wipe'){
      if (confirm('¿Borrar TODOS tus datos de este dispositivo? No se puede deshacer.') && confirm('¿Seguro? Si no tienes copia, se perderán.')){
        try{ localStorage.removeItem(STORE); }catch(_){}
        showLock();
      }
    } else closeModal();
  });
});
function changePw(){
  openModal(`<h3 style="margin-bottom:14px">Cambiar contraseña</h3>
    <form id="pwForm">
      <div class="field"><label>Contraseña actual</label><input type="password" id="pwOld" required></div>
      <div class="field"><label>Nueva contraseña</label><input type="password" id="pwNew" required></div>
      <div class="field"><label>Repite la nueva</label><input type="password" id="pwNew2" required></div>
      <div class="err" id="pwErr"></div>
      <div class="row"><button type="button" class="ghost" id="pwCancel">Cancelar</button><button type="submit" style="flex:1">Cambiar</button></div>
    </form>`);
  $('pwCancel').onclick = closeModal;
  $('pwForm').onsubmit = async e => {
    e.preventDefault();
    const o=$('pwOld').value, n=$('pwNew').value, n2=$('pwNew2').value;
    try { await decryptBlob(readStored() || await encryptState(), o); } catch(_){ $('pwErr').textContent='La contraseña actual no es correcta.'; return; }
    if (n.length<4){ $('pwErr').textContent='Usa al menos 4 caracteres.'; return; }
    if (n!==n2){ $('pwErr').textContent='Las contraseñas nuevas no coinciden.'; return; }
    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(n, salt);
    await save(); closeModal(); toast('Contraseña cambiada');
  };
}

/* ---------- pestañas ---------- */
function tab(which){
  $('tabMes').classList.toggle('hidden', which!=='mes');
  $('tabDeben').classList.toggle('hidden', which!=='deben');
  $('tMes').classList.toggle('on', which==='mes');
  $('tDeben').classList.toggle('on', which==='deben');
  window.scrollTo(0,0);
}
$('tMes').onclick = () => tab('mes');
$('tDeben').onclick = () => tab('deben');

/* ---------- mes ---------- */
function month(){ if (!state.months[cur]) state.months[cur] = {nomina:0, gastos:[]}; return state.months[cur]; }
function shiftMonth(delta){
  const [y,m] = cur.split('-').map(Number);
  cur = monthKey(new Date(y, m-1+delta, 1));
  render();
}
$('prevM').onclick = () => shiftMonth(-1);
$('nextM').onclick = () => shiftMonth(1);

function defaultDate(){ return cur===monthKey(new Date()) ? todayISO() : cur+'-01'; }

$('nominaForm').addEventListener('submit', async e => {
  e.preventDefault();
  const n = parseMoney($('nominaIn').value);
  if (isNaN(n) || n<0){ toast('Escribe una cantidad válida'); return; }
  month().nomina = n; $('nominaIn').value='';
  await save(); render(); toast('Nómina guardada');
});
$('gastoForm').addEventListener('submit', async e => {
  e.preventDefault();
  const imp = parseMoney($('gImporte').value);
  if (isNaN(imp) || imp<=0){ toast('Escribe un importe válido'); return; }
  const fecha = $('gFecha').value || defaultDate();
  const mk = fecha.slice(0,7);
  if (!state.months[mk]) state.months[mk] = {nomina:0, gastos:[]};
  const mm = state.months[mk];
  const o = objById($('gCat').value);
  const antes = o ? totalObj(mm, o.id) : 0;
  mm.gastos.push({id:uid(), concepto:$('gConcepto').value.trim(), importe:imp, fecha, obj:o ? o.id : null, cat:o ? o.nombre : 'Otros'});
  $('gConcepto').value=''; $('gImporte').value='';
  const cambiaMes = mk !== cur;
  if (cambiaMes) cur = mk;
  await save(); render();
  const lim = o ? limiteDe(mm, o) : 0;
  const despues = o ? totalObj(mm, o.id) : 0;
  if (!avisar(o, lim, antes, despues)) toast(cambiaMes ? 'Añadido a ' + monthName(mk) : 'Añadido');
});
function monthName(mk){ const [y,m]=mk.split('-').map(Number); const t = new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); }

function editGasto(id){
  const g = month().gastos.find(x=>x.id===id); if(!g) return;
  openModal(`<h3 style="margin-bottom:14px">Editar gasto</h3>
    <form id="egForm">
      <div class="field"><label>Concepto</label><input id="egC" required value="${esc(g.concepto)}"></div>
      <div class="grid2">
        <div class="field"><label>Importe (€)</label><input id="egI" inputmode="decimal" required value="${String(g.importe).replace('.',',')}"></div>
        <div class="field"><label>Fecha</label><input id="egF" type="date" required value="${esc(g.fecha)}"></div>
      </div>
      <div class="field"><label>Objetivo</label><select id="egCat">${opcionesObjetivos(g.obj || '', g.obj && objById(g.obj))}</select></div>
      <div class="row"><button type="button" class="ghost" id="egX">Cancelar</button><button type="submit" style="flex:1">Guardar</button></div>
    </form>`);
  $('egX').onclick = closeModal;
  $('egForm').onsubmit = async e => {
    e.preventDefault();
    const imp = parseMoney($('egI').value);
    if (isNaN(imp)||imp<=0){ toast('Importe no válido'); return; }
    const fecha = $('egF').value, mk = fecha.slice(0,7);
    if (!state.months[mk]) state.months[mk]={nomina:0,gastos:[]};
    const destino = state.months[mk];
    const o = objById($('egCat').value);
    const antes = o ? totalObj(destino, o.id) : 0;
    Object.assign(g, {concepto:$('egC').value.trim(), importe:imp, fecha, obj:o ? o.id : null, cat:o ? o.nombre : 'Otros'});
    if (mk!==cur){
      month().gastos = month().gastos.filter(x=>x.id!==id);
      destino.gastos.push(g);
    }
    closeModal(); await save(); render();
    if (o) avisar(o, limiteDe(destino, o), antes, totalObj(destino, o.id));
  };
}

/* ---------- deudas ---------- */
$('deudaForm').addEventListener('submit', async e => {
  e.preventDefault();
  const imp = parseMoney($('dImporte').value);
  if (isNaN(imp)||imp<=0){ toast('Escribe una cantidad válida'); return; }
  state.deudas.push({id:uid(), nombre:$('dNombre').value.trim(), importe:imp, desc:$('dDesc').value.trim(), fecha:todayISO(), pagada:false});
  $('dNombre').value=''; $('dImporte').value=''; $('dDesc').value='';
  await save(); render(); toast('Añadido');
});

/* ---------- pintar ---------- */
function render(){
  if (!state) return;
  // Mes
  const m = state.months[cur] || {nomina:0, gastos:[]};
  const ahorrado = m.gastos.filter(esAhorro).reduce((s,g)=>s+g.importe,0);
  const gastado = m.gastos.reduce((s,g)=>s+g.importe,0) - ahorrado;
  const saldo = m.nomina - gastado - ahorrado;
  $('monthTitle').textContent = monthName(cur);
  $('saldo').textContent = money(saldo);
  $('saldo').classList.toggle('neg', saldo<0);
  $('nominaTxt').textContent = money(m.nomina);
  $('gastadoTxt').textContent = money(gastado);
  $('ahorradoTxt').textContent = money(ahorrado);
  const usado = gastado + ahorrado;
  const pct = m.nomina>0 ? Math.min(100, usado/m.nomina*100) : (usado>0?100:0);
  $('barFill').style.width = pct+'%';
  $('bar').classList.toggle('over', usado > m.nomina);

  // Objetivos del mes
  const objs = objsDelMes(m).map(o => ({o, lim:limiteDe(m,o), llevas:totalObj(m,o.id)})).filter(x => x.lim > 0 || x.llevas > 0);
  $('objList').innerHTML = objs.length ? objs.map(({o, lim, llevas}) => {
    let cls = '', txt = '', scls = '';
    const p = lim > 0 ? Math.min(100, llevas/lim*100) : 0;
    if (!(lim > 0)) txt = 'Sin límite definido';
    else if (o.tipo === 'ahorro') { cls = 'goal'; if (llevas >= lim) { txt = '¡Objetivo conseguido!'; scls = 'good'; } else txt = `Faltan ${money(lim - llevas)}`; }
    else if (llevas > lim) { cls = 'over'; txt = `Te has pasado ${money(llevas - lim)}`; scls = 'bad'; }
    else if (llevas === lim) { cls = 'over'; txt = 'Has llegado al límite'; scls = 'bad'; }
    else if (llevas >= lim*0.8) { cls = 'warn'; txt = `Quedan ${money(lim - llevas)}`; scls = 'warn'; }
    else txt = `Quedan ${money(lim - llevas)}`;
    return `<div class="obj">
      <div class="h"><span class="n">${esc(o.nombre)}${o.tipo==='ahorro'?' <span class="tag">ahorro</span>':''}</span>
        <span class="num">${money(llevas)}${lim>0?` <span class="muted" style="font-weight:500">/ ${money(lim)}</span>`:''}</span></div>
      ${lim>0?`<div class="bar ${cls}"><i style="width:${p}%"></i></div>`:''}
      <div class="s ${scls}">${txt}</div>
    </div>`;
  }).join('') : '<p class="empty" style="padding-top:6px">Aún no tienes límites. Pulsa <b>Editar</b> para decidir cuánto quieres gastar y ahorrar en cada cosa.</p>';
  const repartido = objs.reduce((s,x)=>s+x.lim,0);
  const r = $('objResumen'); r.classList.remove('bad');
  if (repartido > 0 && m.nomina > 0) {
    if (repartido > m.nomina) { r.textContent = `Tus objetivos suman ${money(repartido)}, ${money(repartido - m.nomina)} más que la nómina.`; r.classList.add('bad'); }
    else r.textContent = `Repartido ${money(repartido)} de la nómina · sin asignar ${money(m.nomina - repartido)}`;
  } else r.textContent = '';
  $('nominaIn').placeholder = m.nomina>0 ? 'Cambiar nómina (€)' : 'Nómina del mes (€)';
  $('gFecha').value = defaultDate();
  const selPrev = $('gCat').value;
  $('gCat').innerHTML = opcionesObjetivos(objById(selPrev) && !objById(selPrev).archivado ? selPrev : (objsActivos().find(o=>o.tipo!=='ahorro')||{}).id || '');
  pintarHint();

  const gl = $('gastosList');
  const gs = [...m.gastos].sort((a,b)=> b.fecha.localeCompare(a.fecha));
  gl.innerHTML = gs.length ? gs.map(g=>`
    <li class="item">
      <div class="main">
        <div class="t">${esc(g.concepto)}</div>
        <div class="s"><span class="tag">${esc(nombreGasto(g))}</span>${fmtDate(g.fecha)}</div>
        <div class="actions"><button class="soft small" data-edit="${g.id}">Editar</button><button class="danger small" data-delg="${g.id}">Borrar</button></div>
      </div>
      <div class="num ${esAhorro(g)?'pos':'neg'}">${esAhorro(g)?'':'−'}${money(g.importe)}</div>
    </li>`).join('') : '<li class="empty">Aún no hay gastos este mes</li>';
  gl.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editGasto(b.dataset.edit));
  gl.querySelectorAll('[data-delg]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar este gasto?')) return;
    month().gastos = month().gastos.filter(x=>x.id!==b.dataset.delg);
    await save(); render();
  });

  // Deudas
  const pend = state.deudas.filter(d=>!d.pagada);
  const cob = state.deudas.filter(d=>d.pagada);
  const total = pend.reduce((s,d)=>s+d.importe,0);
  $('totalDeben').textContent = money(total);
  $('numDeben').textContent = pend.length ? `${pend.length} ${pend.length===1?'deuda pendiente':'deudas pendientes'}` : 'Nadie te debe nada';
  const item = d => `
    <li class="item ${d.pagada?'paid':''}">
      <div class="main">
        <div class="t">${esc(d.nombre)}</div>
        ${d.desc?`<div class="s">${esc(d.desc)}</div>`:''}
        <div class="s">${fmtDate(d.fecha)}${d.pagada&&d.fechaPago?' · cobrado el '+fmtDate(d.fechaPago):''}</div>
        <div class="actions">
          ${d.pagada ? `<button class="soft small" data-undo="${d.id}">Deshacer</button>` : `<button class="small" data-pay="${d.id}">Cobrado</button>`}
          <button class="danger small" data-deld="${d.id}">Borrar</button>
        </div>
      </div>
      <div class="num ${d.pagada?'':'pos'}">${money(d.importe)}</div>
    </li>`;
  $('debenList').innerHTML = pend.length ? pend.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(item).join('') : '<li class="empty">No hay nada pendiente</li>';
  $('cobradasList').innerHTML = cob.map(item).join('');
  $('cobradasWrap').classList.toggle('hidden', !cob.length);
  $('cobradasSum').textContent = `Cobradas (${cob.length})`;
  const find = id => state.deudas.find(x=>x.id===id);
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{ const d=find(b.dataset.pay); d.pagada=true; d.fechaPago=todayISO(); await save(); render(); toast('Marcado como cobrado'); });
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=async()=>{ const d=find(b.dataset.undo); d.pagada=false; delete d.fechaPago; await save(); render(); });
  document.querySelectorAll('[data-deld]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta deuda?')) return; state.deudas=state.deudas.filter(x=>x.id!==b.dataset.deld); await save(); render(); });
}

showLock();

/* ---------- modo sin conexión ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
